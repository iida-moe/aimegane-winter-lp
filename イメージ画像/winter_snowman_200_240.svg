  <path d="M100 94 L118 100 L100 101 Z" fill="#F08A24" stroke="#1F2440" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M88 108 Q100 116 112 108" fill="none" stroke="#1F2440" stroke-width="3.5" stroke-linecap="round"/>
